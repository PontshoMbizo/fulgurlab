name: Build

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

permissions:
  contents: read

# fulgurlab is pure TypeScript/JavaScript -- the Java/GWT engine and its Gradle
# build were removed, so there is no JDK step and no `gradlew compileGwt` /
# `makeSite` here any more (which also retires the makeSite bug TODO.md P0-2 was
# about: it never copied *.js, so a built site 404'd on the bridge client).
#
# Numerical parity with the old Java oracle is still checked: the golden-trace
# gate replays fixtures recorded from it, committed under
# web/engine/test/golden/fixtures, so nothing Java needs building to verify it.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm --prefix web ci

      - name: Typecheck (engine + app)
        run: npm run typecheck

      # Golden traces vs the recorded oracle, the Java-corpus sweep, and the
      # dump-id coverage gate all live here.
      - name: Engine tests
        run: npm run test:engine

      # Includes the bridge integration suite, which replays recorded backend
      # transcripts and therefore never skips.
      - name: App tests
        run: npm run test:app

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
