name: Deploy to GitHub Pages

on:
  push:
    branches: [ dev ]   # ← Only trigger on pushes to dev

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Was: JDK 8 + `gradlew compileGwt` + `gradlew makeSite`, publishing ./site.
# fulgurlab has no Java build any more, so this publishes the Next app instead.
# `next build` prerenders "/" as static content (verified: 5/5 static pages), so
# `output: "export"` produces a fully static site with no server requirement --
# which is what GitHub Pages needs.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm --prefix web ci

      - name: Build (static export)
        run: npm --prefix web/app run build
        env:
          NEXT_OUTPUT_EXPORT: "1"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/app/out

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
